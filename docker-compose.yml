name: crm

services:
  postgres:
    image: postgres:16-alpine
    container_name: crm-postgres
    environment:
      POSTGRES_DB: crm_db
      POSTGRES_USER: crm
      # Read from .env (gitignored). Falls back to a dev-only default that matches
      # api/appsettings.Development.json. Never use these defaults in production.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crm_dev_d80f006d}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - crm_pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  crm_pgdata:
