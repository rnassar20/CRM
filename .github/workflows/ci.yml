name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  DOTNET_VERSION: '10.0.x'
  NODE_VERSION: '20.x'

jobs:
  backend-build:
    name: Backend build (.NET 10)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - run: dotnet restore
      - run: dotnet build --no-restore --configuration Release

  backend-test:
    name: Backend unit tests (.NET 10)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./api
    needs: backend-build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - run: dotnet restore
      - run: dotnet build --no-restore --configuration Release
      - run: dotnet test --no-build --configuration Release --verbosity normal

  backend-integration:
    name: Backend integration tests (.NET 10 + Testcontainers)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./test/Crm.Api.IntegrationTests
    needs: backend-build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - run: dotnet restore
      - run: dotnet build --no-restore --configuration Release
      - run: >
          dotnet test --no-build --configuration Release --verbosity normal
          --logger "console;verbosity=normal"
          --filter "FullyQualifiedName~Crm.Api.IntegrationTests"

  frontend-ci:
    name: Frontend (React 19 + Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ./web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
